server:
  port: 8080
spring:
  application:
    name: devfolio-builder-api
    # Conexión Reactiva a Neon PostgreSQL
  r2dbc:
    url: r2dbc:postgresql://${NEON_HOST:ep-example.us-east-2.aws.neon.tech}:5432/${NEON_DATABASE:pruebadb}?sslmode=require
    username: ${NEON_USER:tu_usuario}
    password: ${NEON_PASSWORD:tu_password}
    pool:
      initial-size: 5
      max-size: 20
  # Validación de JWTs de Neon Auth
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://tu-neon-auth-domain.com}

logging:
  level:
    org.springframework.r2dbc: DEBUG
    org.springframework.security: DEBUG