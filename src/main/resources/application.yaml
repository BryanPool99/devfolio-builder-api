server:
  port: 8080

spring:
  application:
    name: devfolio-builder-api
  r2dbc:
    url: r2dbc:postgresql://${NEON_HOST:ep-example.us-east-2.aws.neon.tech}:5432/${NEON_DATABASE:pruebadb}?sslmode=require
    username: ${NEON_USER:tu_usuario}
    password: ${NEON_PASSWORD:tu_password}
    pool:
      initial-size: 5
      max-size: 20
app:
  security:
    jwt:
      # Un solo secreto, el algoritmo es HS256. El valor por defecto sirve para
      # desarrollo; en produccion define JWT_SECRET con 32+ caracteres aleatorios.
      secret: ${JWT_SECRET:devfolio-builder-secreto-local-de-desarrollo-cambiar-en-produccion}
      issuer: ${JWT_ISSUER:https://devfolio-builder.api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.r2dbc: DEBUG
    org.springframework.security: DEBUG